name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      publish_platformio:
        description: "Publish the PlatformIO package using PLATFORMIO_AUTH_TOKEN"
        required: false
        default: false
        type: boolean
      confirm_publish:
        description: "Must exactly match version to publish the PlatformIO package"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Verify exact release tag
        run: |
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test "${actual_tag}" = "${{ steps.version.outputs.tag }}"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio
          sudo apt-get update
          sudo apt-get install -y cmake doxygen ninja-build zip

      - name: Check release metadata
        run: python3 scripts/sync_release_metadata.py --check --expected-version "${{ steps.version.outputs.version }}"

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check API reference
        run: python3 scripts/generate_api_reference.py --title "MC Protocol Serial C++ API Reference" --output docsrc/user/API_REFERENCE.md --input include/mcprotocol_serial.hpp --input include/mcprotocol/serial/types.hpp --input include/mcprotocol/serial/status.hpp --input include/mcprotocol/serial/codec.hpp --input include/mcprotocol/serial/client.hpp --input include/mcprotocol/serial/high_level.hpp --input include/mcprotocol/serial/host_sync.hpp --input include/mcprotocol/serial/posix_serial.hpp --input include/mcprotocol/serial/link_direct.hpp --input include/mcprotocol/serial/qualified_buffer.hpp --input include/mcprotocol/serial/version.hpp --predefine MCPROTOCOL_SERIAL_ENABLE_HOST_API=1 --check

      - name: Build release archive
        run: |
          mkdir -p release-artifacts
          archive="release-artifacts/mcprotocol-serial-cpp-v${{ steps.version.outputs.version }}.zip"
          git archive --format=zip --output "${archive}" HEAD
          unzip -l "${archive}" README.md LICENSE library.json library.properties include/* examples/* > /dev/null

      - name: Pack PlatformIO package
        run: |
          python -m platformio pkg pack . --output release-artifacts
          tarball="release-artifacts/mcprotocol-serial-cpp-${{ steps.version.outputs.version }}.tar.gz"
          tar -tzf "${tarball}" > /tmp/platformio-package-files.txt
          cat /tmp/platformio-package-files.txt
          if grep -E '(^|/)(AGENTS\.md|TODO\.md|\.gitignore|\.gitattributes|CMakeLists\.txt)$|(^|/)(scripts|tests|docsrc|docs|internal_docs|release-artifacts|build|build_win|tools)/|\.exe$|\.dll$|\.pdb$' /tmp/platformio-package-files.txt; then
            echo "::error::PlatformIO package contains excluded development files."
            exit 1
          fi
          grep -x 'library.json' /tmp/platformio-package-files.txt
          grep -x 'library.properties' /tmp/platformio-package-files.txt
          grep -x 'include/mcprotocol_serial.hpp' /tmp/platformio-package-files.txt

      - name: Build packed-package consumers
        run: python3 scripts/check_platformio_package_consumers.py --package "release-artifacts/mcprotocol-serial-cpp-${{ steps.version.outputs.version }}.tar.gz"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          asset="release-artifacts/mcprotocol-serial-cpp-v${{ steps.version.outputs.version }}.zip"
          pio_asset="release-artifacts/mcprotocol-serial-cpp-${{ steps.version.outputs.version }}.tar.gz"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" "${pio_asset}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${asset}" "${pio_asset}" --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --generate-notes --verify-tag --draft
          fi

  publish-platformio:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_platformio && inputs.confirm_publish == inputs.version }}
    needs: release
    runs-on: ubuntu-latest
    environment: platformio-publish
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Check PlatformIO registry for an existing version
        shell: pwsh
        run: >-
          ./scripts/check_registry_duplicate.ps1
          -Registry platformio
          -Package fa-yoshinobu/mcprotocol-serial-cpp
          -VersionSource library-properties
          -ManifestPath library.properties
          -CompareSource library-json
          -CompareManifestPath library.json

      - name: Publish PlatformIO package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_platformio && inputs.confirm_publish == inputs.version }}
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          if [ -z "${PLATFORMIO_AUTH_TOKEN}" ]; then
            echo "::error::PLATFORMIO_AUTH_TOKEN secret is not configured."
            exit 1
          fi
          python -m platformio pkg publish . --owner fa-yoshinobu --type library --no-interactive
