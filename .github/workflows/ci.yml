name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-build-and-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen ninja-build

      - name: Check mirrored release metadata
        run: python3 scripts/sync_release_metadata.py --check

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Check API reference
        run: python3 scripts/update_api_reference.py --check

  windows-host-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Check mirrored release metadata
        run: python scripts/sync_release_metadata.py --check

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  platformio-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Check mirrored release metadata
        run: python3 scripts/sync_release_metadata.py --check

      - name: Pack PlatformIO package
        run: |
          mkdir -p /tmp/platformio-package
          python -m platformio pkg pack . --output /tmp/platformio-package
          tar -tzf /tmp/platformio-package/mcprotocol-serial-cpp-*.tar.gz > /tmp/platformio-package/files.txt
          cat /tmp/platformio-package/files.txt

      - name: Check PlatformIO package contents
        run: |
          if grep -E '(^|/)(AGENTS\.md|TODO\.md|\.gitignore|\.gitattributes|CMakeLists\.txt)$|(^|/)(scripts|tests|docsrc|docs|internal_docs|release-artifacts|build|build_win|tools)/|\.exe$|\.dll$|\.pdb$' /tmp/platformio-package/files.txt; then
            echo "::error::PlatformIO package contains excluded development files."
            exit 1
          fi
          grep -x 'library.json' /tmp/platformio-package/files.txt
          grep -x 'library.properties' /tmp/platformio-package/files.txt
          grep -x 'include/mcprotocol_serial.hpp' /tmp/platformio-package/files.txt

      - name: Build packed-package consumers
        run: python3 scripts/check_platformio_package_consumers.py --package /tmp/platformio-package/mcprotocol-serial-cpp-*.tar.gz
